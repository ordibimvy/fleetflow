name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  pipeline-and-data-checks:
    needs: lint
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fleetflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fleetflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run pipeline
        run: python -m pipeline.run
      - name: Data quality checks
        run: pytest -v tests
      - name: Write run summary
        if: always()
        run: |
          echo "## Pipeline run" >> "$GITHUB_STEP_SUMMARY"
          psql "$DATABASE_URL" -c "SELECT * FROM ops.run_metrics" --html >> "$GITHUB_STEP_SUMMARY" || true
