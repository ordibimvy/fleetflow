services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fleetflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 15

  pipeline:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/fleetflow
    depends_on:
      db:
        condition: service_healthy